name: Citation audit checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.10"

      - name: Run existing tests
        run: python -m unittest -v

      - name: Verify documented examples
        shell: python
        run: |
          import json
          import subprocess
          import sys

          keys = ("before_edges", "after_edges", "lost_edges", "added_edges")
          cases = (
              ("filtered.csv", 1, (4, 2, 2, 0)),
              ("preserved.csv", 0, (4, 4, 0, 0)),
          )
          for filename, expected_exit, expected_counts in cases:
              result = subprocess.run(
                  [
                      sys.executable,
                      "reference_audit.py",
                      "examples/accepted_works.json",
                      f"examples/{filename}",
                  ],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              if result.returncode != expected_exit:
                  raise SystemExit(
                      f"{filename}: expected exit {expected_exit}, "
                      f"got {result.returncode}\n{result.stderr}"
                  )
              report = json.loads(result.stdout)
              counts = tuple(report[key] for key in keys)
              if counts != expected_counts:
                  raise SystemExit(f"{filename}: unexpected counts {counts}")
              print(f"{filename}: exit {expected_exit}, counts {counts}; OK")
